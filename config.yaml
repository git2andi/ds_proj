# Option-grounded multi-user simulator.

llm:
  dialogue: "gpt"                     # uni | groq | gemini | gpt
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
    gpt: "gpt-4.1-mini"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  timeouts:
    request_seconds: 240
  gemini_rpm_delay_seconds: 12
  sampling:
    setup: {temperature: 0.35, top_k: 45, top_p: 0.90, max_output_tokens: 0}
    dialogue: {temperature: 0.82, top_k: 60, top_p: 0.94, max_output_tokens: 180}
    repair: {temperature: 0.20, top_k: 25, top_p: 0.80, max_output_tokens: 120}

environment:
  mode: auto                          # auto | manual
  manual: {}

simulation:
  num_participants: 3
  min_participants: 2
  max_participants: 7
  random_seed: null
  setup_generation_attempts: 3        # initial generation + up to two feedback-guided regenerations

participants:
  mode: auto                          # auto | manual
  profiles: []

scenario:
  option_labels: ["A", "B", "C", "D"]
  public_attr_min: 3
  public_attr_max: 5
  shared_context_max_sentences: 2
  shared_context_max_words: 48
  short_alias_max_words: 4

personas:
  hard_blocker_probability: 0.06
  trait_ranges:
    engagement: [1, 5]
    verbosity: [1, 5]
    directness: [1, 5]
    stubbornness: [1, 4]
  preference_distribution:
    forced_shape: null
    shape_weights:
      2: {"1-1": 0.80, "2": 0.20}
      3: {"1-1-1": 0.50, "2-1": 0.45, "3": 0.05}
      4: {"1-1-1-1": 0.35, "2-1-1": 0.40, "2-2": 0.15, "3-1": 0.10}
      5: {"2-1-1-1": 0.40, "2-2-1": 0.30, "3-1-1": 0.20, "3-2": 0.10}
      6: {"2-2-1-1": 0.35, "2-2-2": 0.25, "3-2-1": 0.25, "3-1-1-1": 0.15}
      7: {"2-2-2-1": 0.35, "3-2-1-1": 0.30, "3-2-2": 0.20, "4-1-1-1": 0.15}

conversation:
  min_voluntary_turns_per_participant: 2
  soft_target_voluntary_turns_per_participant: 4
  hard_max_voluntary_turns_per_participant: 6
  soft_target_voluntary_turn_cap: 20
  hard_max_voluntary_turn_cap: 28
  thread_turn_cap: 4                  # opener plus at most three related contributions
  stagnation_no_bid_rounds: 2
  compromise_window_max_turns: 2
  recent_turns_in_prompt: 4
  max_consecutive_turns: 2

simulator:
  bid_probability_by_engagement:
    1: 0.20
    2: 0.35
    3: 0.50
    4: 0.70
    5: 0.90
  movement_probability_by_stubbornness:
    1: 0.80
    2: 0.60
    3: 0.40
    4: 0.20
    5: 0.00

language:
  max_words_by_verbosity:
    1: 8
    2: 12
    3: 16
    4: 22
    5: 27
  action_max_words:
    ask: 18
    answer: 18
  directness_instructions:
    1: "Express disagreement tentatively and as a personal preference; use uncertainty where natural."
    2: "Soften disagreement slightly and avoid categorical judgments."
    3: "State agreement or disagreement neutrally and clearly."
    4: "State the judgment directly with little hedging."
    5: "State the judgment explicitly and firmly, while remaining respectful."

moderator:
  enabled: true

consensus:
  majority_fraction: 0.51

limits:
  warn_total_input_tokens: 80000

output:
  log_dir: "logs"
  write_prompts: false
  prompt_file: "prompts.jsonl"
  transcript_file: "transcript.md"
  json_file: "run.json"
  metrics_csv: "metrics.csv"
  write_action_trace: true
