# ---------------------------------------------------------------------------
# LLM provider
# ---------------------------------------------------------------------------
llm:
  provider: "uni"                          # "uni" | "groq" | "gemini"
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  sampling:
    temperature: 0.85
    top_k: 50
    top_p: 0.95
  gemini_rpm_delay: 12

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
simulation:
  num_participants: 3 #"random"
  num_participants_random: false
  num_participants_min: 2
  num_participants_max: 5

  moderator_style: "active"

# ---------------------------------------------------------------------------
# Turn budget
# ---------------------------------------------------------------------------
turns:
  hard_ceiling: 40                     
  min_before_narrowing: 6              

  # Escalation: rounds after narrowing before the moderator changes strategy.
  # Level 0 (< level_1):  normal nudges and Socratic questions
  # Level 1 (< level_2):  direct "name a compromise" ask
  # Level 2 (< level_3):  firm "we are stuck, something must give"
  # Level 3 (>= level_3): force-close, moderator picks the winner
  escalation_level_1: 4
  escalation_level_2: 8
  escalation_level_3: 12

  phase_budgets:
    opening: 2
    preference_expression: 6
    negotiation: 12
    narrowing: 8
    confirmation: 4

# ---------------------------------------------------------------------------
# Consensus detection
# ---------------------------------------------------------------------------
consensus:
  llm_check_every_n_turns: 5             
  regex_window: 8                          
  stall_rounds_to_force:
    active: 2
    minimal: 3
    passive: 999                           
  max_dissenters_active: 1                 # active: allow up to N dissenters
  max_dissenters_other: 0                  # minimal/passive: unanimity

# ---------------------------------------------------------------------------
# Repetition / stall detection
# ---------------------------------------------------------------------------
repetition:
  pressure_window: 8                       # lines included in overlap calculation
  min_word_length: 3                       # ignore short words in overlap
  forbidden_frames:                        # structural patterns always blocked
    - "building on what * said"
    - "as * mentioned"
    - "to echo what * said"
    - "I agree with * that"

# ---------------------------------------------------------------------------
# Persona generation
# ---------------------------------------------------------------------------
personas:
  generate_backstory: true                 
  generate_goal: true

  trait_min: 1      # global lower bound for all traits not listed in trait_ranges
  trait_max: 5      # global upper bound for all traits not listed in trait_ranges

  # Per-trait constraints for random generation. Overrides trait_min/trait_max for that trait.
  #   fixed int  →  e.g.  response_length: 2        (always exactly 2)
  #   [min, max] →  e.g.  response_length: [1, 3]   (random within 1–3)
  # Traits not listed here use the global trait_min/trait_max.
  # Note: enforce_diversity may still bump agreeableness/contrarian if those are constrained.
  #
  # Available traits: assertiveness, friendliness, talkativeness, agreeableness,
  #                   patience, contrarian, response_length
  trait_ranges:
    response_length: [1, 3]

  # if ALL sims have agreeableness >= diversity_agree_threshold, one is resampled low (1–2)
  # if NO sim has contrarian >= diversity_contrarian_min, one is bumped to that value
  enforce_diversity: true
  diversity_agree_threshold: 4        
  diversity_contrarian_min: 4             

# ---------------------------------------------------------------------------
# Participants — manual definition (overrides random generation)
# ---------------------------------------------------------------------------
# Set from_config: true and fill entries to use this instead of random generation.
# CLI flag --personas takes priority over this section.
#
# Each entry is a dict. All fields are optional:
#   name          string  — omit or set null for a random pool name
#   role          string  — omit to let the LLM assign a topic-relevant role
#   is_primary    bool    — omit to let the LLM decide
#   goal          string  — omit to let the LLM generate
#   backstory     string  — omit to let the LLM generate
#   <trait>       int     — fixed value 1–5, e.g. assertiveness: 5
#   <trait>       [min,max] — random within range, e.g. contrarian: [3, 5]
#
# Traits: assertiveness, friendliness, talkativeness, agreeableness,
#         patience, contrarian, response_length
#
# Examples (remove the leading '#' to activate):
# entries:
#   - name: "Alice"
#     assertiveness: 5
#     agreeableness: [1, 2]
#   - name: "Bob"
#     contrarian: 5
#     friendliness: 1
#   - {}                  # fully random participant with a random name
participants:
  from_config: false
  entries: []

# ---------------------------------------------------------------------------
# Output / logging
# ---------------------------------------------------------------------------
output:
  log_dir: "logs"
  save_csv: true
  save_txt: true