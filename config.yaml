# ---------------------------------------------------------------------------
# LLM provider
# ---------------------------------------------------------------------------
llm:
  provider: "uni"                          # "uni" | "groq" | "gemini"
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  sampling:
    temperature: 0.9
    top_k: 50
    top_p: 0.95
  gemini_rpm_delay: 12
  timeouts:
    request_seconds: 120

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
simulation:
  num_participants: 3

# ---------------------------------------------------------------------------
# Turn budget — scales with participant count so 2 and 5 sims both behave.
# ---------------------------------------------------------------------------
turns:
  ceiling_per_participant: 9             # hard ceiling = max(min_ceiling, n * this)
  min_ceiling: 18
  min_before_narrowing_per_participant: 3  # opening + ~2 negotiation rounds each before narrowing
  narrow_after_per_participant: 4          # force narrowing once everyone's had ~this many turns

  # Rounds AFTER narrowing before the moderator escalates. A grace of n rounds
  # is added at runtime so larger groups have time to collect every vote first.
  escalation_level_1: 2
  escalation_level_2: 4
  escalation_level_3: 7

# ---------------------------------------------------------------------------
# Consensus
# ---------------------------------------------------------------------------
consensus:
  stall_rounds_to_force: 2
  max_dissenters: 1

  # Weights for ConsensusEngine.best_available_decision() — public stances only
  stance_weights:
    support: 1.0
    conditional_support: 0.7
    ambiguous: 0.2
    oppose: -1.0
    blocker: -2.0
    neutral: 0.0

# ---------------------------------------------------------------------------
# Repetition / stall detection (single Jaccard-based check)
# ---------------------------------------------------------------------------
repetition:
  pressure_window: 8
  min_word_length: 3
  jaccard_threshold_self: 0.45
  stall_increment_threshold: 0.70

# ---------------------------------------------------------------------------
# Persona generation
# ---------------------------------------------------------------------------
personas:
  generate_backstory: true
  generate_goal: true

  trait_min: 1
  trait_max: 5

  # Big Five: openness, conscientiousness, extraversion, agreeableness, neuroticism
  # response_length is output control, not a personality trait.
  trait_ranges:
    openness: [3, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [3, 5]
    neuroticism: [1, 4]
    response_length: [2, 4]               # a touch more substance; mixes short and fuller turns

  enforce_diversity: true
  diversity_agree_threshold: 5
  diversity_extraversion_min: 4

# ---------------------------------------------------------------------------
# Response length budgets
# ---------------------------------------------------------------------------
response_length:
  word_budgets: [14, 22, 30, 42, 55]
  phase_caps:
    opening: 28           # hello + one priority, not a full case
    confirmation: 14
    narrowing_min: 14
    narrowing_max: 30
    emergence: 32
    closure: 16

# ---------------------------------------------------------------------------
# Stubbornness — rare per-dialogue hard blocker (single knob)
# ---------------------------------------------------------------------------
stubbornness:
  hard_blocker_dialogue_probability: 0.05

# ---------------------------------------------------------------------------
# Fisher (1970) — logged per dialogue, not used for control flow
# ---------------------------------------------------------------------------
fisher:
  window_size: 8

# ---------------------------------------------------------------------------
# Prompt budget
# ---------------------------------------------------------------------------
prompt_budget:
  recent_turns_short: 6

# ---------------------------------------------------------------------------
# Turn-policy weights (SSJ self-selection scoring)
# ---------------------------------------------------------------------------
turn_policy:
  weights:
    extraversion: 0.22
    agreeableness_off: 0.04
    openness_negotiation: 0.08
    conscientiousness_negotiation: 0.05
    neuroticism_pressure: 0.10
    primary_boost: 0.10
    unspoken_boost: 0.55
  penalties:
    last_speaker: 0.50
    recent_speaker_per_turn: 0.25
    own_repetition: 0.30
    introvert_off_turn: 0.08

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  log_dir: "logs"

# ---------------------------------------------------------------------------
# Grounding (deterministic fact-check, no LLM)
# ---------------------------------------------------------------------------
grounding:
  enable_fact_check: true
  repair_attempts: 1
  min_words_to_check: 12

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  eval_scenarios_path: "eval/eval_scenarios.txt"
  seed: 42
