# Autonomous option-grounded multi-user simulator.

llm:
  dialogue: "gpt"                     # uni | groq | gemini | gpt
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
    gpt: "gpt-4.1-mini"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  timeouts:
    request_seconds: 240
  gemini_rpm_delay_seconds: 12
  sampling:
    setup: {temperature: 0.35, top_k: 45, top_p: 0.90, max_output_tokens: 0}
    dialogue: {temperature: 0.82, top_k: 60, top_p: 0.94, max_output_tokens: 220}
    repair: {temperature: 0.20, top_k: 25, top_p: 0.80, max_output_tokens: 220}

environment:
  type: "option_grounded_group_decision"
  source_of_truth: "generated_option_board"
  mode: auto                          # auto | manual
  manual: {}

simulation:
  num_participants: 3
  min_participants: 2
  max_participants: 7
  random_seed: null
  setup_generation_attempts: 3

participants:
  mode: auto                          # auto | manual
  profiles: []
  # Manual profiles may be partial. Direct traits use integer low..high scales:
  # traits: {engagement: 4, verbosity: 2, directness: 5, stubbornness: 3}
  # A manual hard blocker sets hard_blocker: true, exactly one preferred option,
  # and a rejection_reason. The builder rejects multiple hard blockers.

scenario:
  option_labels: ["A", "B", "C", "D"]
  public_attr_min: 3
  public_attr_max: 5
  shared_context_max_sentences: 2
  shared_context_max_words: 48
  short_alias_min_chars: 4
  short_alias_max_words: 3

personas:
  hard_blocker_probability: 0.06
  trait_ranges:
    engagement: [1, 5]
    verbosity: [1, 5]
    directness: [1, 5]
    stubbornness: [1, 4]
  preference_distribution:
    forced_shape: null
    shape_weights:
      2: {"1-1": 0.80, "2": 0.20}
      3: {"1-1-1": 0.50, "2-1": 0.45, "3": 0.05}
      4: {"1-1-1-1": 0.35, "2-1-1": 0.40, "2-2": 0.15, "3-1": 0.10}
      5: {"2-1-1-1": 0.40, "2-2-1": 0.30, "3-1-1": 0.20, "3-2": 0.10}
      6: {"2-2-1-1": 0.35, "2-2-2": 0.25, "3-2-1": 0.25, "3-1-1-1": 0.15}
      7: {"2-2-2-1": 0.35, "3-2-1-1": 0.30, "3-2-2": 0.20, "4-1-1-1": 0.15}

conversation:
  min_voluntary_turns_per_participant: 2       # Minimum voluntary discussion turns scaled by group size before normal closure is allowed.
  soft_target_voluntary_turns_per_participant: 5  # Preferred voluntary discussion length per participant before the system starts looking to close.
  hard_max_voluntary_turns_per_participant: 7  # Maximum voluntary discussion length per participant before discussion must stop.
  soft_target_voluntary_turn_cap: 22           # Absolute ceiling on the scaled soft target so large groups do not grow indefinitely.
  hard_max_voluntary_turn_cap: 30              # Absolute ceiling on all voluntary discussion turns, regardless of group size.
  issue_follow_up_cap: 3                       # Maximum total follow-up turns attached to one active question or concern.
  direct_question_optional_follow_up_cap: 1    # Maximum voluntary third-party reactions after the addressed participant answers.
  concern_external_response_cap: 2             # Maximum distinct nonowners who may voluntarily respond to one concern.
  max_concerns_per_participant: 1              # Maximum concerns one participant may open during a run; zero disables participant concerns.
  max_concern_reopens: 1                       # Maximum times a previously closed concern may be reopened during narrowing.
  diagnostic_allow_reason_reuse: false         # Allows repeated semantic reasons only in deliberately extended diagnostic runs.
  stagnation_no_bid_rounds: 1                  # Consecutive empty bidding rounds before the runtime tries compromise or closure behavior.
  compromise_window_max_turns: 1               # Maximum participant contributions allowed in one open compromise window.
  narrowing_reaction_turn_cap: 2               # Maximum participant turns inside one ordinary narrowing reaction window.
  small_group_max_participants: 4              # Largest group size that receives the special small-group pacing rules below.
  small_group_extra_no_bid_rounds: 1           # Extra ordinary bidding rounds a small group gets after an empty floor before closing.
  small_group_shared_acceptance_extra_turns: 3 # Extra voluntary turns small groups allow before shared acceptability closes discussion.
  unanimous_closure_min_voluntary_turns_per_participant: 1.0  # Minimum post-opening voluntary contributions per participant before early unanimous closure.
  large_group_min_participants: 5              # Smallest group size that receives the large-group narrowing limits below.
  large_group_optional_reaction_window_cap: 2  # Maximum separate optional reaction windows during large-group narrowing.
  large_group_narrowing_issue_turn_cap: 1      # Maximum active-issue response turns after each required large-group final position.
  large_group_narrowing_final_position_cap: 3  # Maximum dissenters asked for required final positions in large-group narrowing.
  recent_turns_in_prompt: 7                    # Number of latest visible dialogue turns included in each realization prompt.
  max_consecutive_turns: 2                     # Hard maximum consecutive participant turns by the same simulator.

simulator:
  bid_probability_by_engagement:               # Chance an eligible simulator submits a voluntary bid at each engagement level.
    1: 0.20                                    # Very low engagement.
    2: 0.35                                    # Low engagement.
    3: 0.50                                    # Medium engagement.
    4: 0.70                                    # High engagement.
    5: 0.90                                    # Very high engagement.
  question_modes:                              # Question forms the simulator may choose when asking another participant.
    - choice_impact                            # Ask whether a stated issue changes the addressee's option choice.
    - tradeoff                                 # Ask how the addressee weighs two competing option properties.
  unknown_information_question_probability: 0.08  # Chance that a question asks which relevant detail is not supplied by the option board.
  movement_probability_by_stubbornness:        # Chance a valid narrowing opportunity produces acceptance or switching at each stubbornness level.
    1: 0.80                                    # Very flexible participant.
    2: 0.60                                    # Fairly flexible participant.
    3: 0.40                                    # Moderately resistant participant.
    4: 0.20                                    # Strongly resistant participant.
    5: 0.00                                    # Hard blocker; movement is prohibited.

language:
  max_words_by_verbosity:                      # Base soft maximum for ordinary utterances at each verbosity level.
    1: 8                                       # Very concise participant.
    2: 12                                      # Concise participant.
    3: 16                                      # Medium-length participant.
    4: 22                                      # Detailed participant.
    5: 27                                      # Very detailed participant.
  action_max_words:                            # Additional soft ceilings for acts that should stay shorter than ordinary discussion turns.
    acknowledge: 12                            # Brief acknowledgment or agreement.
    ask: 18                                    # Direct or group question.
    answer: 18                                 # Answer to an active question.
    final_position: 18                         # Required narrowing statement before voting.
    vote: 10                                   # Vote that may also make a stance change explicit.
    simple_vote: 8                             # Vote with no new stance movement or explanation.
  near_duplicate_similarity_threshold: 0.92    # Text similarity at or above this value triggers a near-duplicate repair.
  near_duplicate_recent_turns: 3               # Number of the speaker's latest eligible utterances checked for near duplication.
  directness_instructions:                     # Realization guidance used for each directness level; it affects wording, not decisions.
    1: "Express disagreement tentatively and as a personal preference; use uncertainty where natural."  # Very indirect.
    2: "Soften disagreement slightly and avoid categorical judgments."                                  # Somewhat indirect.
    3: "State agreement or disagreement neutrally and clearly."                                         # Neutral.
    4: "State the judgment directly with little hedging."                                                # Direct.
    5: "State the judgment explicitly and firmly, while remaining respectful."                           # Very direct.

moderator:
  enabled: true

consensus:
  majority_fraction: 0.51

limits:
  warn_total_input_tokens: 80000

output:
  log_dir: "logs"
  write_prompts: false
  prompt_file: "prompts.jsonl"
  transcript_file: "transcript.md"
  json_file: "run.json"
  metrics_csv: "metrics.csv"
  debug_metrics: false
  write_action_trace: false
