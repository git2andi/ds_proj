# ---------------------------------------------------------------------------
# LLM provider
# ---------------------------------------------------------------------------
llm:
  provider: "uni"                          # "uni" | "groq" | "gemini"
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  sampling:
    temperature: 0.9
    top_k: 50
    top_p: 0.95
  gemini_rpm_delay: 12

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
simulation:
  num_participants: 3
  num_participants_random: false
  num_participants_min: 2
  num_participants_max: 5

  moderator_style: "active"

# ---------------------------------------------------------------------------
# Turn budget
# ---------------------------------------------------------------------------
turns:
  hard_ceiling: 40
  min_before_narrowing: 9   # greeting(n) + opening(n) + at least one negotiation round(n)

  # Escalation: rounds after narrowing before the moderator changes strategy.
  escalation_level_1: 2
  escalation_level_2: 5
  escalation_level_3: 9

# ---------------------------------------------------------------------------
# Consensus detection
# ---------------------------------------------------------------------------
consensus:
  llm_check_every_n_turns: 5
  regex_window: 8
  stall_rounds_to_force:
    active: 2
    minimal: 3
    passive: 999
  max_dissenters_active: 1
  max_dissenters_other: 0

# ---------------------------------------------------------------------------
# Repetition / stall detection
# ---------------------------------------------------------------------------
repetition:
  pressure_window: 8
  min_word_length: 3
  forbidden_frames:
    - "building on what * said"
    - "as * mentioned"
    - "to echo what * said"
    - "I agree with * that"
    - "fair about * but"
    - "maybe there's something to be said"
    - "I can see the appeal"
    - "not fully sold but"

# ---------------------------------------------------------------------------
# Persona generation
# ---------------------------------------------------------------------------
personas:
  generate_backstory: true
  generate_goal: true

  trait_min: 1
  trait_max: 5

  # Available Big Five traits:
  # openness, conscientiousness, extraversion, agreeableness, neuroticism
  #
  # Communication field:
  # response_length (output-control only, not a personality trait)
  #
  # A fixed int pins a trait. A [min, max] pair samples within that range.
  trait_ranges:
    openness: [2, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [1, 5]
    neuroticism: [1, 5]
    response_length: [1, 4]

  # If all sims are very agreeable, one gets lower agreeableness for real disagreement.
  # If nobody is outgoing, one gets bumped so the chat has social energy.
  enforce_diversity: true
  diversity_agree_threshold: 4
  diversity_extraversion_min: 4

# ---------------------------------------------------------------------------
# Participants - manual definition (overrides random generation)
# ---------------------------------------------------------------------------
# Set from_config: true and fill entries to use this instead of random generation.
# CLI flag --personas takes priority over this section.
#
# Each entry is a dict. All fields are optional:
#   name          string
#   role          string
#   is_primary    bool
#   goal          string
#   backstory     string
#   <trait>       int       - fixed value 1-5, e.g. extraversion: 5
#   <trait>       [min,max] - random within range, e.g. neuroticism: [1, 3]
#
# Traits: openness, conscientiousness, extraversion, agreeableness, neuroticism
# Communication: response_length
#
# Examples:
# entries:
#   - name: "Alice"
#     extraversion: 5
#     agreeableness: [1, 2]
#   - name: "Bob"
#     conscientiousness: 5
#     neuroticism: 2
#     response_length: 1
#   - {}
participants:
  from_config: false
  entries: []

# ---------------------------------------------------------------------------
# Output / logging
# ---------------------------------------------------------------------------
output:
  log_dir: "logs"
  save_csv: true
  save_txt: true
