# Master group-discussion simulator configuration.
# Rule: every tweakable numeric parameter used by the repo lives here.
# Rule: every prompt/chat template lives in src/prompts.py.

llm:
  provider: "uni"                    # uni | groq | gemini | mock
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
    mock: "mock"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  timeouts:
    request_seconds: 120
  gemini_rpm_delay_seconds: 12
  sampling:
    setup:
      temperature: 0.34
      top_k: 45
      top_p: 0.88
    dialogue:
      temperature: 0.82
      top_k: 60
      top_p: 0.94
    repair:
      temperature: 0.22
      top_k: 25
      top_p: 0.78

simulation:
  num_participants: 3
  min_participants: 2
  max_participants: 7
  random_seed: null
  max_repairs_per_turn: 1
  setup_generation_attempts: 2

scenario:
  option_labels: ["A", "B", "C", "D"]
  public_attr_min: 3
  public_attr_max: 5
  option_prompt_max_words: 34
  option_name_max_words: 8
  # Hidden per-participant utility: each persona privately rates every option in
  # [score_min, score_max]; they can live with an option scoring >= acceptance_score.
  score_min: 1
  score_max: 5
  acceptance_score: 3

personas:
  trait_min: 1
  trait_max: 5
  trait_ranges:
    openness: [2, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [3, 5]
    neuroticism: [1, 3]
    response_length: [1, 5]
  cooperative_controls:
    compromise_willingness: [0.62, 0.92]
    patience: [0.55, 0.90]
    initiative: [0.35, 0.82]
    directness: [0.18, 0.72]
    detail: [0.36, 0.90]
  hard_blocker_probability: 0.04
  hard_blocker_compromise: [0.10, 0.35]
  hard_blocker_patience: [0.25, 0.55]
  non_blocker_min_acceptable: 2
  non_blocker_max_soft_rejections: 1
  preferred_diversity_min_unique: 2
  require_common_compromise: true
  min_reasons_preferred: 2
  min_reasons_acceptable: 1

conversation:
  # Convergence is driven by how concentrated the group's leanings are, not by
  # filling per-option reason counters. Keep these few knobs.
  hard_max_participant_turns: 30
  min_turns_per_participant_before_narrowing: 2
  min_total_participant_turns: 9
  min_options_touched_before_narrowing: 3
  concentration_to_narrow: 0.6      # fraction of group sharing the leading lean
  force_narrowing_turns: 22         # narrow regardless once this many turns pass
  no_progress_window_turns: 6
  # Moderator facilitation: step in when the discussion circles, and to nudge a lone holdout.
  moderator_stall_window: 4         # consecutive no-progress turns before the mod steps in
  moderator_cooldown_turns: 5       # min turns between moderator interventions
  moderator_max_interventions: 3

routing:
  recent_speaker_window: 5
  last_speaker_penalty: 0.70
  recent_speaker_penalty: 0.25
  low_turn_count_boost: 0.45
  unspoken_boost: 0.95
  initiative_weight: 0.24
  unresolved_objection_boost: 0.34
  preferred_option_gap_boost: 0.40
  acceptable_option_gap_boost: 0.22
  direct_reply_probability: 0.62
  act_probabilities:
    react: 0.16
    ask: 0.11
    compare: 0.25
    support: 0.16
    object: 0.16
    push_back: 0.09
    propose_compromise: 0.07
  late_discussion_compromise_bonus: 0.10
  no_progress_compromise_probability: 0.55
  length_hint_probabilities:
    short: 0.28
    medium: 0.54
    long: 0.18

utterances:
  recent_turns_in_prompt: 8
  recent_turns_after_question: 8
  max_focus_options_in_prompt: 3
  max_public_board_lines: 8
  word_budgets:
    opening: 32
    short: 18
    medium: 42
    long: 68
    answer: 36
    ask: 32
    vote: 34
    confirm: 28
    closure: 22
  hard_cap_extra_words: 8
  repair_issue_limit: 4

validation:
  enabled: true                   # master switch for all deterministic guardrails
  own_similarity_threshold: 0.62  # repetition sensitivity vs the speaker's own turns
  group_similarity_threshold: 0.72
  repeated_start_window: 5
  repeated_start_word_count: 3
  max_question_chain: 2
  repair_on_warning: false        # whether warning-level issues also trigger a repair
  max_new_numbers_without_source: 1

consensus:
  majority_fallback_fraction: 0.67   # support fraction needed for a no-consensus fallback pick

output:
  log_dir: "logs"
  write_prompts: false          # when true, all prompts for a run go to one prompts.jsonl
  prompt_file: "prompts.jsonl"
  transcript_file: "transcript.md"
  json_file: "run.json"
  metrics_csv: "metrics.csv"    # master file, one appended row per run
