# Group discussion simulator configuration.
# Tunable numbers live here. LLM-facing prose lives in prompts.py.

llm:
  provider: "uni"
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  sampling:
    setup:
      temperature: 0.25
      top_k: 40
      top_p: 0.85
    dialogue:
      temperature: 0.72
      top_k: 50
      top_p: 0.92
    repair:
      temperature: 0.25
      top_k: 30
      top_p: 0.8
    validator:
      temperature: 0.0
      top_k: 1
      top_p: 1.0
  gemini_rpm_delay: 12
  timeouts:
    request_seconds: 120

simulation:
  num_participants: 3
  min_participants: 2
  max_participants: 7
  random_seed: null
  max_repairs_per_turn: 1
  allow_unresolved_result: true

scenario:
  option_count: 4
  option_labels: ["A", "B", "C", "D"]
  max_generation_attempts: 3
  attr_min: 3
  attr_max: 7
  score_min: 1
  score_max: 5
  forbidden_live_fact_terms:
    - "availability"
    - "available rooms"
    - "waitlist"
    - "wait list"
    - "booking status"
    - "call ahead"
    - "check online"
    - "look up"
    - "live weather"
    - "unknown"
    - "uncertain"
    - "not specified"
    - "limited availability"

personas:
  trait_min: 1
  trait_max: 5
  trait_ranges:
    openness: [2, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [3, 5]
    neuroticism: [1, 3]
    response_length: [1, 5]
  cooperative_defaults:
    compromise_willingness_range: [0.58, 0.92]
    patience_range: [0.45, 0.88]
    initiative_range: [0.35, 0.82]
    conflict_directness_range: [0.20, 0.78]
    detail_level_range: [0.30, 0.88]
  hard_blocker_dialogue_probability: 0.05
  hard_blocker_max_count: 1
  non_blocker_min_acceptable: 2
  non_blocker_max_soft_rejections: 1
  require_group_common_acceptable: true
  preferred_diversity_min_unique: 2
  fallback_names: ["Ava", "Liam", "Mia", "Noah", "Lena", "Jonas", "Sofia"]

conversation:
  min_turns_per_participant_before_close: 2
  soft_min_total_turns: 7
  hard_max_total_turns: 34
  max_moderator_ratio: 0.28
  no_progress_window: 5
  recent_turn_window: 8
  participant_turn_balance_gini_max: 0.42
  min_options_with_reason_before_narrowing: 3
  min_total_option_reasons_before_narrowing: 5
  min_distinct_participants_before_narrowing: 2
  readiness_threshold: 0.72
  force_vote_after_readiness: 0.86
  confirmation_max_rounds: 2

routing:
  recent_speaker_window: 5
  last_speaker_penalty: 0.45
  recent_speaker_penalty: 0.20
  unspoken_boost: 0.65
  low_turn_count_boost: 0.28
  addressed_question_priority: 1.0
  unresolved_objection_boost: 0.25
  compromise_intent_probability: 0.18
  pushback_intent_probability: 0.20
  clarify_intent_probability: 0.12
  compare_intent_probability: 0.22
  react_intent_probability: 0.28
  length_hint_probabilities:
    short: 0.32
    medium: 0.53
    long: 0.15

utterances:
  word_budgets:
    short: 14
    medium: 32
    long: 58
    vote: 24
    confirm: 22
    opening: 30
    closure: 18
  hard_cap_extra_words: 8
  max_recent_turns_in_prompt: 8
  max_option_cards_in_prompt: 4
  allow_rare_emoji: false
  banned_register_phrases:
    - "valid point"
    - "I appreciate your perspective"
    - "as a compromise candidate"
    - "emerging support"
    - "from my perspective"
    - "I understand your concern"

validation:
  enabled: true
  own_turn_similarity_threshold: 0.55
  semantic_repeat_threshold: 0.62
  option_fact_number_window_chars: 80
  max_new_numbers_without_option_source: 1
  multi_turn_prefix_pattern: "^[A-ZÄÖÜ][A-Za-zÄÖÜäöüß .'-]{1,30}:"
  min_vote_clarity: true
  max_question_chain: 2
  style_banned_phrase_is_fatal: false
  repair_on_warnings: true

consensus:
  majority_fraction_to_test: 0.5
  min_accept_fraction_for_consensus: 1.0
  allow_majority_fallback_after_max_turns: true
  majority_fallback_fraction: 0.67
  unresolved_requires_hard_blocker_or_max_turns: true

output:
  log_dir: "logs"
  write_prompts: true
  write_json: true
