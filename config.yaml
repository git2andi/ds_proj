# Option-grounded multi-user simulator configuration.
# Keep this file small: only parameters that are useful to tune live here.

llm:
  provider: "gpt"                     # uni | groq | gemini | gpt
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
    gpt: "gpt-4.1-mini"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  timeouts:
    request_seconds: 240
  gemini_rpm_delay_seconds: 12
  sampling:
    setup:
      temperature: 0.35
      top_k: 45
      top_p: 0.90
    dialogue:
      temperature: 0.82
      top_k: 60
      top_p: 0.94
    repair:
      temperature: 0.20
      top_k: 25
      top_p: 0.80

environment:
  type: "option_grounded_group_decision"
  source_of_truth: "generated_option_board"

simulation:
  num_participants: 3
  min_participants: 2
  max_participants: 7
  random_seed: null
  setup_generation_attempts: 3
  max_repairs_per_turn: 1

scenario:
  option_labels: ["A", "B", "C", "D"]
  public_attr_min: 3
  public_attr_max: 5
  option_prompt_max_words: 46
  option_name_max_words: 12
  option_board_attr_max: 3              # shown in transcript/moderator opening; full facts remain available to prompts
  option_board_note_max_words: 9
  shared_context_max_items: 3
  shared_context_max_words: 18
  short_alias_min_chars: 4
  short_alias_max_words: 3

personas:
  # OCEAN traits are sampled here, then converted into explicit simulator parameters
  # in src/simulator.py: engagement, verbosity, initiative, responsiveness,
  # stubbornness, directness, and compromise_threshold.
  # Chance that exactly one participant is sampled as a hard blocker.
  # A hard blocker gets agreeableness=1 and normally cannot accept their rejected option.
  hard_blocker_probability: 0.06
  trait_min: 1
  trait_max: 5
  trait_ranges:
    openness: [2, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [2, 5]
    neuroticism: [1, 4]
  hard_blocker_trait_ranges:
    openness: [1, 2]
    conscientiousness: [3, 5]
    extraversion: [1, 5]
    agreeableness: [1, 1]
    neuroticism: [3, 5]
  preference_distribution:
    forced_shape: null
    shape_weights:
      2: {"1-1": 0.80, "2": 0.20}
      3: {"1-1-1": 0.50, "2-1": 0.45, "3": 0.05}
      4: {"1-1-1-1": 0.35, "2-1-1": 0.40, "2-2": 0.15, "3-1": 0.10}
      5: {"2-1-1-1": 0.40, "2-2-1": 0.30, "3-1-1": 0.20, "3-2": 0.10}
      6: {"2-2-1-1": 0.35, "2-2-2": 0.25, "3-2-1": 0.25, "3-1-1-1": 0.15}
      7: {"2-2-2-1": 0.35, "3-2-1-1": 0.30, "3-2-2": 0.20, "4-1-1-1": 0.15}

conversation:
  # The controller derives actual turn caps from n and traits. These are per participant.
  min_discussion_turns_per_participant: 3.0
  target_discussion_turns_per_participant: 4.0
  max_discussion_turns_per_participant: 6.0
  contention_extra_turns: 2            # added when starting preferences are split
  low_compromise_extra_turns: 1         # added when average compromise is low
  concentration_to_vote: 0.75           # visible leading lean share needed for early vote
  early_vote_extra_turns: 2             # after min_turns, wait this many turns before concentration can trigger voting
  response_obligation_turns: 2          # turns a directly-addressed participant has to answer before the obligation lapses
  moderator_stall_window: 6             # no-progress turns before one moderator nudge
  moderator_cooldown_turns: 5
  moderator_max_interventions: 1
  max_vote_rounds: 2
  require_option_coverage_before_vote: true  # each option should be mentioned/compared once before final voting when feasible

routing:
  # Lightweight conversational move mix. The engine samples from these, then applies local constraints.
  move_weights:
    build: 0.23       # add a reason or extend common ground
    agree: 0.14       # agree with someone and add a small reason
    challenge: 0.16   # object or push back
    ask: 0.10         # ask a concrete question
    answer: 0.10      # answer an open question
    compare: 0.16     # compare two options
    invite: 0.05      # pull a quiet participant in
    propose_compromise: 0.06
  direct_address_probability: 0.32
  extraversion_turn_weight: 0.12
  quiet_speaker_boost: 1.25

style:
  # Local surface-naturalness tracker over the last few participant turns.
  name_prefix_window: 4              # how many recent participant turns to scan
  name_prefix_max_fraction: 0.4     # above this share of name-prefixed openings, suppress names on non-functional turns
  option_opening_max_fraction: 0.25 # above this share of option-name openings, tell the next turn to lead differently
  repeated_opening_window: 3        # consecutive turns sharing one opening word before variation is forced
  repeated_pattern_window: 3        # consecutive turns sharing one surface pattern before variation is forced

utterances:
  recent_turns_in_prompt: 5
  response_target_max_words: 22
  word_budgets:
    opening: 22
    discussion: 24
    ask: 22
    answer: 24
    vote: 18
    moderator: 22
    closure: 18

validation:
  enabled: true
  grounding_check: true        # LLM fact-checker: flag utterances that invent facts beyond the option board
  grounding_acts: ["opening", "build", "agree", "challenge", "answer", "compare", "propose_compromise"]

limits:
  warn_total_input_tokens: 30000   # print a warning if a run's total input tokens exceed this

consensus:
  majority_fraction: 0.51

output:
  log_dir: "logs"
  write_prompts: false
  prompt_file: "prompts.jsonl"
  transcript_file: "transcript.md"
  json_file: "run.json"
  metrics_csv: "metrics.csv"
