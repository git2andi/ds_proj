llm:
  dialogue: gpt
  validator: gpt
  models:
    uni: llama3.3:latest
    groq: llama-3.3-70b-versatile
    gemini: gemini-2.0-flash-lite
    gpt: gpt-4.1-mini
  endpoints:
    uni: http://ursa.ds.uni-bamberg.de:11434/api/generate
  timeouts:
    request_seconds: 240
  gemini_rpm_delay_seconds: 12
  sampling:
    setup:
      temperature: 0.35
      top_k: 45
      top_p: 0.9
    dialogue:
      temperature: 0.82
      top_k: 60
      top_p: 0.94
    repair:
      temperature: 0.2
      top_k: 25
      top_p: 0.8
    validator:
      temperature: 0.0
      top_k: 1
      top_p: 1.0
      max_output_tokens: 600
environment:
  type: option_grounded_group_decision
  source_of_truth: generated_option_board
  mode: manual
  manual:
    topic: Choose whether two roommates should upgrade cleaning at home
    shared_context:
    - Two roommates share the apartment costs equally.
    - The maximum budget is 450 euros.
    - Both want less weekly cleaning friction.
    options:
    - id: A
      name: Eufy Robot Vacuum
      attrs:
        cost: 260 euros
        task: daily floor cleaning
        space: needs clear floor paths
      upside: reduces visible dust without manual effort
      concern: does not help with dishes or kitchen cleanup
      short_name: Robot Vacuum
    - id: B
      name: Bosch Compact Dishwasher
      attrs:
        cost: 430 euros
        task: daily dishes
        space: uses counter space
      upside: removes the most common kitchen chore
      concern: does not help with dust or floors
      short_name: Dishwasher
    - id: C
      name: Monthly Cleaning Service Trial
      attrs:
        cost: 80 euros per month
        task: general cleaning
        duration: three-month trial
      upside: covers several chores without buying equipment
      concern: depends on scheduling someone to come in
      short_name: Cleaning Trial
    - id: D
      name: Shared Cleaning Supplies Kit
      attrs:
        cost: 70 euros
        task: manual cleaning
        storage: small closet box
      upside: cheap and easy to start immediately
      concern: may not change habits enough
      short_name: Supplies Kit
simulation:
  num_participants: 2
  min_participants: 2
  max_participants: 7
  random_seed: 201
  setup_generation_attempts: 3
  max_repairs_per_turn: 1
participants:
  mode: manual
  profiles:
  - name: Maja
    age: 23
    speech_style: young casual wording
    description: stubborn graduate student in a shared apartment who thinks floors are the visible problem
    private_goal: wants the robot vacuum and does not want a counter-space appliance
    preferred_option: A
    traits:
      openness: 2
      conscientiousness: 4
      extraversion: 2
      agreeableness: 1
      neuroticism: 4
    parameters:
      engagement: 0.55
      verbosity: 0.45
      directness: 0.8
      stubbornness: 0.95
      switch_resistance: 0.95
    rejection: B
    rejection_reason: it is near the budget limit and uses counter space
  - name: Felix
    age: 58
    speech_style: direct workplace wording
    description: stubborn long-time tenant who thinks dishes cause most conflict and distrusts partial
      floor-only fixes
    private_goal: wants the dishwasher and does not want a device that ignores the kitchen mess
    preferred_option: B
    traits:
      openness: 2
      conscientiousness: 4
      extraversion: 3
      agreeableness: 1
      neuroticism: 3
    parameters:
      engagement: 0.6
      verbosity: 0.5
      directness: 0.85
      stubbornness: 0.95
      switch_resistance: 0.95
    rejection: A
    rejection_reason: it does not help with dishes or kitchen cleanup
scenario:
  option_labels:
  - A
  - B
  - C
  - D
  public_attr_min: 3
  public_attr_max: 5
  shared_context_max_items: 3
  shared_context_max_words: 18
  short_alias_min_chars: 4
  short_alias_max_words: 3
personas:
  hard_blocker_probability: 0.06
  trait_min: 1
  trait_max: 5
  trait_ranges:
    openness:
    - 2
    - 5
    conscientiousness:
    - 2
    - 5
    extraversion:
    - 1
    - 5
    agreeableness:
    - 2
    - 5
    neuroticism:
    - 1
    - 4
  hard_blocker_trait_ranges:
    openness:
    - 1
    - 2
    conscientiousness:
    - 3
    - 5
    extraversion:
    - 1
    - 5
    agreeableness:
    - 1
    - 1
    neuroticism:
    - 3
    - 5
  preference_distribution:
    forced_shape: 1-1
    shape_weights:
      2:
        1-1: 0.8
        '2': 0.2
      3:
        1-1-1: 0.5
        2-1: 0.45
        '3': 0.05
      4:
        1-1-1-1: 0.35
        2-1-1: 0.4
        2-2: 0.15
        3-1: 0.1
      5:
        2-1-1-1: 0.4
        2-2-1: 0.3
        3-1-1: 0.2
        3-2: 0.1
      6:
        2-2-1-1: 0.35
        2-2-2: 0.25
        3-2-1: 0.25
        3-1-1-1: 0.15
      7:
        2-2-2-1: 0.35
        3-2-1-1: 0.3
        3-2-2: 0.2
        4-1-1-1: 0.15
conversation:
  min_discussion_turns_per_participant: 5.0
  target_discussion_turns_per_participant: 6.0
  max_discussion_turns_per_participant: 7.0
  contention_extra_turns: 2
  low_compromise_extra_turns: 1
  early_vote_extra_turns: 2
  question_answer_window_turns: 2
  moderator_stall_window: 6
  moderator_cooldown_turns: 5
  moderator_max_interventions: 1
  max_vote_rounds: 2
  require_option_coverage_before_vote: true
moderator:
  enabled: true
  opening: true
  mid_discussion_nudges: true
  final_vote_call: true
  closing: true
threads:
  cooling_turns: 2
  stale_after_turns: 4
  hard_blocker_stale_after_turns: 6
  max_thread_turns_soft: 3
  max_thread_turns_hard: 5
  cooling_continue_probability: 0.45
  cooling_continue_if_disagreement: 0.6
  cooling_continue_if_blocker: 0.75
  allow_reactivation: true
narrowing:
  require_discussion_support: true
  require_no_hot_blocking_thread: true
  stable_top_pair_window: 2
  allow_return_to_discussion_once: true
floor:
  max_share_overshoot: 0.16
  max_silence_rounds: 2
  quiet_speaker_boost: 1.25
style:
  name_prefix_window: 4
  name_prefix_max_fraction: 0.3
  option_opening_max_fraction: 0.25
  i_opening_max_fraction: 0.35
  we_opening_max_fraction: 0.3
  repeated_opening_window: 3
  repeated_pattern_window: 3
utterances:
  recent_turns_in_prompt: 4
  response_target_max_words: 18
  word_budgets:
    opening: 18
    discussion: 15
    ask: 13
    answer: 13
    vote: 11
    moderator: 20
corpus:
  preset: null
  presets:
    delidata:
      turns_per_participant: 4.5
      preferred_group_size: 3
      top_speaker_share: 0.4
      dominance_range:
      - 0.3
      - 0.5
      imbalance_tolerance: 0.15
validation:
  mode: critical
limits:
  warn_total_input_tokens: 50000
consensus:
  majority_fraction: 0.51
output:
  log_dir: eval/logs_eval_suite
  write_prompts: false
  prompt_file: prompts.jsonl
  transcript_file: transcript.md
  json_file: run.json
  metrics_csv: metrics.csv
  case_id: c01_manual_manual_n2_stubborn_deadlock
  suite_version: critical-validation-consensus-v8
  case_fingerprint: 23f30171434564bf
