# ===========================================================================
# Dialogue-simulation configuration
#
# Two hard rules:
#   1. No magic numbers in code -- every tunable lives here.
#   2. No LLM prose in code   -- every prompt lives in src/prompts.py.
# ===========================================================================

# ---------------------------------------------------------------------------
# LLM provider
# ---------------------------------------------------------------------------
llm:
  provider: "uni"                          # "uni" | "groq" | "gemini"
  models:
    uni: "llama3.3:latest"
    groq: "llama-3.3-70b-versatile"
    gemini: "gemini-2.0-flash-lite"
  endpoints:
    uni: "http://ursa.ds.uni-bamberg.de:11434/api/generate"
  sampling:
    # Lowered after prompt-shape fixes (update.md §4.10). Naturalness is
    # produced by the prompt + verifier; lower randomness reduces ramble.
    temperature: 0.65
    top_k: 40
    top_p: 0.9
  gemini_rpm_delay: 12
  timeouts:
    request_seconds: 120

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
simulation:
  num_participants: 3

# ---------------------------------------------------------------------------
# Turn budget -- ceilings/floors that scale with participant count.
# After Stage 5, narrowing is gated on deliberation signals (positions stated
# with reason + at least one challenge-response), not just turn count. These
# values are floors/ceilings around that gate.
# ---------------------------------------------------------------------------
turns:
  ceiling_per_participant: 11              # hard ceiling = max(min_ceiling, n * this)
  min_ceiling: 22

  # Floor: don't even consider narrowing before each sim has had at least this
  # many turns. Lets opening + at least one real round of exchange happen.
  min_before_narrowing_per_participant: 4

  # Ceiling: force narrowing once everyone's had this many turns, even if
  # deliberation signals haven't fired (otherwise contested topics could
  # never close).
  narrow_after_per_participant: 7

  # Rounds AFTER narrowing before escalation triggers a moderator nudge or
  # force-close. A grace of n rounds is added at runtime so larger groups
  # can finish collecting votes first.
  escalation_level_1: 3
  escalation_level_2: 6
  escalation_level_3: 10

# ---------------------------------------------------------------------------
# Consensus
# ---------------------------------------------------------------------------
consensus:
  stall_rounds_to_force: 2
  max_dissenters: 1

  # Weights for ConsensusEngine.best_available_decision() -- public stances only.
  stance_weights:
    support: 1.0
    conditional_support: 0.7
    ambiguous: 0.2
    oppose: -1.0
    blocker: -2.0
    neutral: 0.0

  # Weights for ConsensusEngine._leading_option() -- mirrors above but is the
  # narrower signal for "what option is currently winning".
  leading_weights:
    support: 1.0
    conditional_support: 0.7

# ---------------------------------------------------------------------------
# Repetition / stall detection (single Jaccard-based check)
# ---------------------------------------------------------------------------
repetition:
  pressure_window: 8
  min_word_length: 3
  jaccard_threshold_self: 0.45
  stall_increment_threshold: 0.70

# ---------------------------------------------------------------------------
# Persona generation
# ---------------------------------------------------------------------------
personas:
  generate_backstory: true
  generate_goal: true

  trait_min: 1
  trait_max: 5

  # Big Five: openness, conscientiousness, extraversion, agreeableness, neuroticism.
  # response_length is output control, not a personality trait.
  trait_ranges:
    openness: [3, 5]
    conscientiousness: [2, 5]
    extraversion: [1, 5]
    agreeableness: [2, 5]                  # opened up a bit so we get genuine pushback
    neuroticism: [1, 4]
    response_length: [1, 5]

  enforce_diversity: true
  diversity_agree_threshold: 5
  diversity_extraversion_min: 4


# ---------------------------------------------------------------------------
# Response length budgets (Big Five "response_length" maps to these)
# ---------------------------------------------------------------------------
response_length:
  word_budgets: [14, 22, 30, 42, 55]
  phase_caps:
    opening: 28
    confirmation: 14
    narrowing_min: 14
    narrowing_max: 30
    emergence: 32
    closure: 16

# ---------------------------------------------------------------------------
# Big Five -> voice (Shanahan 2023; Character-LLM). Trait-driven speech
# features so personas don't all sound like the same polite evaluator.
# All values are normalised 0..1 deltas applied to a 0.5 baseline.
# ---------------------------------------------------------------------------
voice:
  # Hedge frequency lifts with neuroticism + agreeableness, drops with low neuroticism.
  hedge_neuroticism_weight: 0.35
  hedge_agreeableness_weight: 0.25

  # Directness lifts with (1 - agreeableness). Disagreeable sims say "no" plainly.
  directness_disagreeableness_weight: 0.55
  directness_low_neuroticism_weight: 0.15

  # "Think-aloud" / fragment use lifts with extraversion + low conscientiousness.
  thinkaloud_extraversion_weight: 0.40
  thinkaloud_low_conscientiousness_weight: 0.20

  # Detail-citing (names option text fragments) lifts with conscientiousness.
  detail_conscientiousness_weight: 0.50

# ---------------------------------------------------------------------------
# Argument kit (Toulmin 1958) -- belief generation targets and constraints.
# Each persona's private belief block carries reasons + reservation +
# would_reconsider_if alongside preferred/acceptable/rejected.
# ---------------------------------------------------------------------------
argument_kit:
  reasons_per_persona: 2                   # 1-2 Toulmin warrants in the prompt
  reasons_min: 1
  reasons_max: 3
  reservation_required: true               # one concern about a rival option
  reconsider_required: true                # the concrete condition that would move them

# ---------------------------------------------------------------------------
# Divergence (Liang 2023 -- "Encouraging Divergent Thinking"). Cooperative
# sims that start in DIFFERENT places for good reasons. Acceptable sets must
# still overlap so consensus is reachable.
# ---------------------------------------------------------------------------
divergence:
  target_acceptable_min: 2                 # each sim must accept at least this many
  target_acceptable_max: 3                 # ...and at most this many (smaller than 4-of-4)
  enforce_distinct_preferred: true         # nudge if all preferred match
  required_common_acceptable: 1            # the overlap that makes consensus reachable

# ---------------------------------------------------------------------------
# Per-sim memory (Park 2023 scaled down -- relevance-filtered, no reflection).
# Anti-repetition + build-on. Fed to the speaker card instead of raw history.
# ---------------------------------------------------------------------------
memory:
  # Trimmed (update.md §5.2): the memory block was overfeeding abstract repeated
  # terms. Keep your own anti-repeat strong; reduce others-summary noise to
  # stop sims trading the same concern words back and forth.
  points_made_max: 4                       # the speaker's own recent points (anti-repeat)
  others_arguments_max: 2                  # trimmed -- was 4
  open_challenges_max: 2                   # questions/objections aimed AT this sim
  perceived_priorities_max_chars: 50       # short phrase per other sim, from opening
  show_perceived_priorities: false         # update.md: drop summary-heavy block

# ---------------------------------------------------------------------------
# Deliberation gating (Du 2023; Liang 2023). Narrowing fires when all three:
#   - each sim has stated a position with a reason
#   - at least one challenge-response exchange has happened on a contested option
#   - repetition pressure shows the live arguments are exhausted
# Turn counts (above) remain as a hard floor/ceiling.
# ---------------------------------------------------------------------------
deliberation:
  challenges_to_unlock_narrowing: 1
  positions_with_reason_required_ratio: 1.0     # 1.0 = everyone
  exhaustion_pressure_threshold: 0.60           # below the global stall threshold
  challenge_window_turns: 6                     # a challenge counts as "answered" if rebutted within N turns

  # Act-planner suppression: when this share of recent participant turns ended
  # in "?", the planner drops ASK_CLARIFICATION from the pool. Hypothetical
  # question pile-ups ("what about X?", "what if Y?") are dodges -- the act
  # planner should push toward committing instead.
  question_density_window: 6
  question_density_suppress: 0.50

# ---------------------------------------------------------------------------
# Stubbornness -- the one route to a legitimate force-close. Rare hard blocker.
# ---------------------------------------------------------------------------
stubbornness:
  hard_blocker_dialogue_probability: 0.05

# ---------------------------------------------------------------------------
# Fisher (1970) -- evaluation-only ratios written to .eval.json.
# Not used for control flow; kept for analysis.
# ---------------------------------------------------------------------------
fisher:
  window_size: 8

# ---------------------------------------------------------------------------
# Prompt budget
# ---------------------------------------------------------------------------
prompt_budget:
  recent_turns_short: 6

# ---------------------------------------------------------------------------
# Turn-policy weights (SSJ self-selection scoring)
# ---------------------------------------------------------------------------
turn_policy:
  weights:
    extraversion: 0.22
    agreeableness_off: 0.04
    openness_negotiation: 0.08
    conscientiousness_negotiation: 0.05
    neuroticism_pressure: 0.10
    primary_boost: 0.10
    unspoken_boost: 0.55
    unspoken_recent_factor: 0.70           # spoken-but-not-recently gets boost * this
  penalties:
    last_speaker: 0.50
    recent_speaker_per_turn: 0.25
    own_repetition: 0.30
    introvert_off_turn: 0.08
  introvert_threshold: 2                   # extraversion <= this is "introverted" for penalty
  recent_speaker_window: 6
  min_score_floor: 0.01

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  log_dir: "logs"

# ---------------------------------------------------------------------------
# Grounding (deterministic). After Stage 4, the check is SCOPED to claims
# made directly about options (numbers asserted as option attributes). World
# knowledge from the persona's backstory/expertise is permitted -- that's the
# raw material of a real argument (Toulmin warrants).
# ---------------------------------------------------------------------------
grounding:
  enable_fact_check: true
  repair_attempts: 1
  min_words_to_check: 12
  # Window (chars) around an option mention within which a number is treated
  # as an asserted option attribute. Outside this window numbers are world
  # knowledge ("CRISPR has been around since 2012" not an option attribute).
  option_proximity_chars: 60

# ---------------------------------------------------------------------------
# Moderation -- timing thresholds for facilitator interventions (Stage 3).
# ---------------------------------------------------------------------------
moderation:
  outlier_repeat_jaccard: 0.55             # post-narrowing verbatim-repeat threshold
  recent_window_history: 10                # lines of history the moderator sees
  recent_window_clarify: 4
  recent_window_force_close: 6
  questions_pile_up_for_facilitation: 2    # >= this many "?" in window triggers facilitate-questions
  facilitate_cooldown_rounds: 2            # don't facilitate twice in a row
  emergence_min_level_for_stall: 2         # below this escalation, emergence stall uses emergence prompt

# ---------------------------------------------------------------------------
# Verification -- deterministic post-generation checks (verifier.py).
# Each check can be disabled individually for debugging.
# ---------------------------------------------------------------------------
verification:
  enabled: true
  repair_attempts: 1                       # max one repair attempt per turn
  check_repetition: true                   # self-repetition vs. own recent turns
  check_option_validity: true              # invalid refs, option denial, invented facts
  check_moderator_options: true            # moderator introducing new options / fake consensus
  check_votes: true                        # missing explicit vote during narrowing
  check_confirmation: true                 # unclear yes/no during confirmation

  # Jaccard thresholds for self-repetition detection.
  own_last_turn_jaccard: 0.55             # last own turn similarity -> repair
  own_points_similarity: 0.65             # older memory points similarity -> warn

  # ACK_LOOP (update.md §4.3) -- repair when this turn is ack-led AND
  # several recent participant turns also opened with acknowledgement.
  check_ack_loop: true
  ack_loop_window: 3                       # last N non-self participant turns scanned
  ack_loop_min_recent_with_ack: 2          # >= this many of those must contain ack
  ack_loop_max_words_for_pure_ack: 14      # short ack-only turns always count
  ack_loop_head_chars: 60                  # ack phrase must appear in the first N chars

  # SEMANTIC_POINT_REPEAT (update.md §4.4) -- repair when current turn restates
  # a prior point by the same speaker (same option mention + high overlap, OR
  # very high overlap on no-option remarks). Stronger than the existing warn.
  # Same-option threshold is lower since shared option already means the
  # speaker is on the same topic -- the attribute words just need to overlap.
  check_semantic_point_repeat: true
  semantic_repeat_jaccard_same_option: 0.35
  semantic_repeat_jaccard_no_option: 0.55

# ---------------------------------------------------------------------------
# Surface moves (update.md §4.2) -- lightweight stochastic nudge that
# occasionally biases the next turn toward a short non-analytical move
# (yes/no, question, compromise, decision-move). NOT a heavy act planner --
# a tiny prompt hint chosen with these probabilities.
# ---------------------------------------------------------------------------
surface_moves:
  enable: true
  hint_prob_normal: 0.30                   # share of normal turns getting any hint
  hint_prob_high_repetition: 0.85          # when repetition pressure is high
  # Weights for hint kinds (relative; normalised by the sampler).
  # The hints themselves live in prompts.surface_move_hint().
  weights_normal:
    ack_only: 1.0
    short_no: 1.0
    question: 1.0
    compromise: 1.0
    new_reason: 1.0
  weights_high_repetition:
    decision_move: 3.0                     # bias hard toward forward motion
    short_no: 1.5
    ack_only: 1.0
    new_reason: 0.5

# ---------------------------------------------------------------------------
# Closure (update.md §4.9) -- don't force every sim to produce a sign-off line.
# Moderator success line + a small number of participant reactions is enough.
# ---------------------------------------------------------------------------
closure:
  participants_to_close: 2                 # 0..n; how many sims close. 0 = mod only.
  always_close_primary: true               # primary always gets a slot if >=1

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  eval_scenarios_path: "eval/eval_scenarios.txt"
  seed: 42
