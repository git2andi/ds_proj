# Evaluation scenario spread.
# Each entry is a topic + a list of group sizes to run it at.
# run_eval.py iterates these, setting config.yaml's num_participants per run.
#
# Coverage targets:
#   - At least one small (2-3), medium (4-5), and large (6-7) group per topic domain.
#   - Topics from diverse domains so fixes aren't accidentally topic-specific.

scenarios:
  # --- everyday / social ---
  - topic: "Plan a birthday party for Steve"
    sizes: [3, 5]

  - topic: "Decide which board game to play at game night"
    sizes: [4, 7]

  - topic: "Pick a restaurant for Friday dinner"
    sizes: [2, 5]

  - topic: "Choose a movie for tonight"
    sizes: [3]

  # --- travel ---
  - topic: "Book a flight to Stockholm"
    sizes: [2, 4]

  - topic: "Plan a road trip route for spring break"
    sizes: [3, 6]

  - topic: "Pick a study-abroad destination for the semester"
    sizes: [3, 5]

  # --- university / academic ---
  - topic: "Decide on a university project for the AI course"
    sizes: [3, 4]

  - topic: "Choose a topic for the group presentation in marketing class"
    sizes: [2, 5]

  # --- creative / hypothetical ---
  - topic: "Which sci-fi technology should exist today?"
    sizes: [4, 7]

  - topic: "Design the perfect video game together"
    sizes: [3, 6]

  # --- household / practical ---
  - topic: "Choose a new coffee machine for the shared kitchen"
    sizes: [2, 4]

  - topic: "Decide how to redecorate the living room"
    sizes: [3]

  # --- community / group ---
  - topic: "Choose a charity to support as a team"
    sizes: [4, 7]

  - topic: "Plan the end-of-semester class party"
    sizes: [5, 6]

  - topic: "Decide on a book for next week's book club"
    sizes: [3, 5]
